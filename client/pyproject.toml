[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ksp-autocraft"
version = "0.7.0"
authors = [{name = "fubuki11st"}]
description = "Contract-aware natural-language spacecraft design and KSP editor API client"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/fubuki11/KSP-AutoCraft"

[project.scripts]
autocraft = "ksp_autocraft.__main__:main"

[tool.setuptools]
packages = ["ksp_autocraft"]
